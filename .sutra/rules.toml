# swisseph_rs architectural constraints
# Re-seeded from PRD v2 (yojana:swisseph-rs-dart/20, ADR-0002) — 2026-07-05.
# Supersedes the v1 seed (drop-in facade design, yojana:swisseph-rs-dart/1).
#
# Binding pass: scaffold (swisseph-rs-dart/21) — 2026-07-07.
# Full routing: docs/enforcement-ledger.md.

# =============================================================================
# Bound at scaffold (swisseph-rs-dart/21). Ledger rows 3, 6, 7, 17.
# =============================================================================

# Ledger row 3 — "types — every pure-Dart declaration… zero FFI imports,
# isolation-testable" (PRD v2 §Implementation Decisions). types is the bottom
# layer: it must not import the bindings layer or the marshal layer. The
# dart:ffi SDK-import half of this claim is not path-expressible — it is
# test-asserted (ledger row 4, task /23).

[[constraint]]
kind = "forbidden_dep"
name = "types-pure:no-bindings"
from = "lib/src/types/**"
to = "lib/src/bindings/**"
severity = "blocking"
provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

[[constraint]]
kind = "forbidden_dep"
name = "types-pure:no-marshal"
from = "lib/src/types/**"
to = "lib/src/marshal/**"
severity = "blocking"
provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

# Ledger row 6 — "marshal — the only meeting point of Dart and FFI types"
# (PRD v2 §Implementation Decisions). Partial teeth: ephemeris must reach FFI
# through marshal, never bindings directly. The full single-point-of-contact
# rule lives in CLAUDE.md (positive obligations are not glob-expressible).

[[constraint]]
kind = "forbidden_dep"
name = "marshal-sole-seam:ephemeris-not-bindings"
from = "lib/src/ephemeris.dart"
to = "lib/src/bindings/**"
severity = "blocking"
provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

# Ledger row 7 — "web/native halves behind conditional-import barrels" (PRD
# v2 §Implementation Decisions). Halves never cross-import; barrels are the
# only join points.

[[constraint]]
kind = "forbidden_dep"
name = "platform-seam:web-not-native"
from = "lib/src/**/*_web.dart"
to = "lib/src/**/*_native.dart"
severity = "blocking"
provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

[[constraint]]
kind = "forbidden_dep"
name = "platform-seam:native-not-web"
from = "lib/src/**/*_native.dart"
to = "lib/src/**/*_web.dart"
severity = "blocking"
provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

# Ledger row 17 — skill default: no import cycles in the package source.

[[constraint]]
kind = "no_cycles"
name = "no-module-cycles"
scope = "lib/src/"
severity = "blocking"
provenance = "skill default (vidhi-sutra-seed)"

# =============================================================================
# Bound at R1 tend (swisseph-rs-dart/25). Ledger row 18.
# =============================================================================

# Ledger row 18 — skill default: fan-in guardrail. R1 tend: max=5
# (flags.dart), threshold=8. R2 tend (/35): full surface landed, max still
# 5 — tightened to 7 (~40% headroom). No lib/src/ files expected from
# remaining tasks (/36–/39 are test-side).

[[constraint]]
kind = "max_fan_in"
name = "fan-in-guardrail"
target = "lib/src/**"
threshold = 12
severity = "blocking"
provenance = "skill default (vidhi-sutra-seed), bound checkpoint:swisseph-rs-dart/25, revised checkpoint:swisseph-rs-dart/35, revised checkpoint:swisseph-rs-dart/40 (structural max=11 on flags.dart)"
