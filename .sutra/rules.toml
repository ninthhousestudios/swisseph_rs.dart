# Ledger row 3 — "types — every pure-Dart declaration… zero FFI imports,
# isolation-testable" (PRD v2 §Implementation Decisions). types is the bottom
# layer: it must not import the bindings layer or the marshal layer. The
# dart:ffi SDK-import half of this claim is not path-expressible — it is
# test-asserted (ledger row 4, task /23).
#
# [[constraint]]
# kind = "forbidden_dep"
# name = "types-pure:no-bindings"
# from = "lib/src/types/**"
# to = "lib/src/bindings/**"
# severity = "blocking"
# provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"
#
# [[constraint]]
# kind = "forbidden_dep"
# name = "types-pure:no-marshal"
# from = "lib/src/types/**"
# to = "lib/src/marshal/**"
# severity = "blocking"
# provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

# Ledger row 6 — "marshal — the only meeting point of Dart and FFI types"
# (PRD v2 §Implementation Decisions). Partial teeth: ephemeris must reach FFI
# through marshal, never bindings directly. The full single-point-of-contact
# rule lives in CLAUDE.md (positive obligations are not glob-expressible).
#
# [[constraint]]
# kind = "forbidden_dep"
# name = "marshal-sole-seam:ephemeris-not-bindings"
# from = "lib/src/ephemeris.dart"
# to = "lib/src/bindings/**"
# severity = "blocking"
# provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"

# Ledger row 7 — "web/native halves behind conditional-import barrels" (PRD
# v2 §Implementation Decisions). Halves never cross-import; barrels are the
# only join points. At scaffold, verify sutra's Dart import resolution
# expresses this; if not expressible, re-route ledger row 7 to bucket (c) —
# CLAUDE.md already carries the invariant text.
#
# [[constraint]]
# kind = "forbidden_dep"
# name = "platform-seam:web-not-native"
# from = "lib/src/**/*_web.dart"
# to = "lib/src/**/*_native.dart"
# severity = "blocking"
# provenance = "yojana:swisseph-rs-dart/20 §implementation-decisions"
#
# [[constraint]]
# kind = "forbidden_dep"
# name = "platform-seam:native-not-web"
