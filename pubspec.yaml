name: swisseph_rs
description: >-
  Idiomatic Dart transliteration of the swisseph-rs Rust API —
  typed, stateless, isolate-safe Swiss Ephemeris bindings via FFI.
version: 0.0.1-dev
repository: https://github.com/ninthhousestudios/swisseph_rs.dart
license: AGPL-3.0-or-later

environment:
  sdk: ^3.12.0

dependencies:
  ffi: ^2.2.0
  wasm_ffi: ^2.3.0
  logging: ^1.3.0
  hooks: ^2.0.2
  code_assets: ^1.2.0

dev_dependencies:
  analyzer: ^14.0.0
  lints: ^6.0.0
  test: ^1.25.6

hook:
  build:
    enabled: true
