include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - lib/src/bindings/bindings_web.dart
    - lib/src/ffi_types_web.dart
    - lib/src/lifecycle_web.dart
    - lib/src/loader_web.dart
    - lib/src/wasm_state.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
